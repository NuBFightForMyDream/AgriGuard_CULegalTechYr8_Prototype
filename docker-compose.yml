services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agriguard
      POSTGRES_PASSWORD: agriguard
      POSTGRES_DB: agriguard
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./Database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriguard -d agriguard"]
      interval: 3s
      retries: 10

  be:
    build: ./Backend
    environment:
      DATABASE_URL: postgresql+psycopg://agriguard:agriguard@db:5432/agriguard
      CORS_ORIGINS: '["http://localhost:3000"]'
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:
