[project]
name = "agriguard-ai"
version = "0.1.0"
description = "AgriGuard AI: Legal AI, navigation chatbot, QC photo assist, harvest forecast (no database access)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.7",
    "google-genai>=3.0",
    "pillow>=11",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agriguard_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning"]
